[project]
name = "pi-my-chrome"
version = "0.1.0"
description = "Pi extension: agent browses with your Chrome profile. CloakBrowser stealth + Jev ultrafast decisions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "jev-ultrafast>=0.1,<0.2",
  "cloakbrowser>=0.5.7",
  "httpx[http2]>=0.28,<1",
]

[project.optional-dependencies]
dev = ["ruff>=0.14,<9", "pytest>=8.4,<9"]

[tool.ruff]
line-length = 120
